<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>김장대첩 운영진 보드</title>
<meta name="theme-color" content="#1B1B1B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#FFFAEC; --surface:#FFFFFF; --surface-2:#F6F0E2; --ink:#1B1B1B; --muted:#6B6458; --line:#E6DECD;
  --accent:#FF5F18; --accent-soft:#FFE6D9; --pin:#FFF0C2;
  --ok:#23863A; --ok-soft:#DDF3E1; --warn:#8A6200; --warn-soft:#FFF0C2;
  --display:"Black Han Sans","IBM Plex Sans KR","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Pretendard","Malgun Gothic",-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#151412; --surface:#1F1D1A; --surface-2:#2A2724; --ink:#F4F0E8; --muted:#A9A196; --line:#39352F;
  --accent:#FF7A3D; --accent-soft:#3A2418; --pin:#382E14;
  --ok:#6FCF83; --ok-soft:#183322; --warn:#E8C25A; --warn-soft:#382E14; color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--body)}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
button{font:inherit;color:inherit}

/* 머리글 */
.top{background:#1B1B1B;color:#FFFAEC;padding:calc(18px + env(safe-area-inset-top)) 0 16px}
.eyebrow{font:600 11.5px var(--mono);letter-spacing:.08em;color:#FF8A57;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.staff-badge{font:700 11px var(--body);letter-spacing:0;background:#FF5F18;color:#fff;border-radius:5px;padding:1px 7px}
h1{font:400 clamp(26px,7vw,38px)/1.1 var(--display);margin:6px 0 12px;letter-spacing:-.01em;word-break:keep-all}
.facts{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:5px 12px;margin:0;padding:0;list-style:none;font-size:14px}
.facts li{display:contents}
.facts b{color:#FF8A57;font-weight:500;white-space:nowrap}
.facts span{color:#FFFAEC;word-break:keep-all;overflow-wrap:anywhere}

/* 탭 */
.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:2px}
.tab{flex:1;border:0;background:none;padding:12px 2px 10px;font:700 14.5px var(--body);color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--accent)}
.tab small{display:block;font:500 11px var(--mono);color:var(--muted)}
main{padding:14px 0 calc(48px + env(safe-area-inset-bottom))}

/* 공통 */
.sec-h{font:400 21px var(--display);margin:22px 0 10px}
.sec-h small{font:500 13px var(--body);color:var(--muted);margin-left:6px}
.msg{margin:12px 0;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:13px;color:var(--muted)}
.empty{padding:30px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
footer{text-align:center;font-size:12px;color:var(--muted);padding:8px 0 24px}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.st{display:inline-block;font:700 11px var(--body);border-radius:5px;padding:1px 6px;white-space:nowrap;vertical-align:1px}
.st.ok{background:var(--ok-soft);color:var(--ok)}
.st.draft{background:var(--surface-2);color:var(--muted)}
.st.check{background:var(--warn-soft);color:var(--warn)}
.chip{display:inline-block;font-size:11.5px;font-weight:500;border-radius:999px;padding:0 8px;background:var(--surface-2);color:var(--muted)}

/* 공지 */
.notes{display:grid;gap:10px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.note.pin{background:var(--pin);border-color:transparent}
.note h3{margin:0 0 4px;font-size:15.5px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.note p{margin:0;font-size:14px;white-space:pre-line;word-break:keep-all;overflow-wrap:anywhere}
.note .d{font:500 11.5px var(--mono);color:var(--muted);margin-left:auto}
.tag{font:700 11px var(--body);background:var(--accent);color:#fff;border-radius:5px;padding:1px 6px}
.todo{display:grid;gap:8px}
.todo button{all:unset;cursor:pointer;display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.todo .tm{font:600 12.5px var(--mono);color:var(--muted)}
.todo b{display:block;font-size:14.5px;margin:1px 0 2px;word-break:keep-all}
.todo p{margin:0;font-size:13px;color:var(--muted);white-space:pre-line;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* 이름 고르기 */
.who{position:sticky;top:57px;z-index:15;background:var(--bg);margin:0 -16px;padding:8px 16px 10px;border-bottom:1px solid var(--line)}
.who-l{font-size:12px;color:var(--muted);margin-bottom:6px}
.names{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.names::-webkit-scrollbar{display:none}
.nm{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font:600 14px var(--body);cursor:pointer;white-space:nowrap}
.nm[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.nm.all[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}

/* 전체 표: 운영진 이름이 가로 한 줄 */
.grid-hint{font-size:12.5px;color:var(--muted);margin:10px 0 6px}
.gwrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);max-height:calc(100svh - 190px);-webkit-overflow-scrolling:touch}
table.g{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.g th,.g td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:7px 8px;vertical-align:top;text-align:left}
.g thead th{position:sticky;top:0;z-index:3;background:var(--surface-2);font-weight:700;white-space:nowrap;text-align:center}
.g .c0{position:sticky;left:0;z-index:2;background:var(--surface);width:148px;min-width:148px;max-width:148px;box-shadow:2px 0 0 var(--line)}
.g thead .c0{z-index:4;background:var(--surface-2);text-align:left}
.g td.p{min-width:104px;max-width:150px;word-break:keep-all;overflow-wrap:anywhere;white-space:pre-line}
.g td.p.has{background:var(--accent-soft);font-weight:500}
.g td.p.none{color:var(--line);text-align:center}
.g .c0 button{all:unset;cursor:pointer;display:block}
.g .c0 .tm{font:600 12px var(--mono);color:var(--muted)}
.g .c0 b{display:block;font-size:13px;line-height:1.35;word-break:keep-all;margin:1px 0 3px}
.g tr.cur .c0{box-shadow:inset 4px 0 0 var(--accent),2px 0 0 var(--line)}
.g tr.past{opacity:.5}
.g th.me{background:var(--accent);color:#fff}

/* 개인 보기 */
.mine-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:14px 0 10px}
.mine-h h2{font:400 21px var(--display);margin:0}
.mine-h small{color:var(--muted);font-size:13px}
.cards{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.card.cur{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.card.past{opacity:.55}
.card.other{background:transparent}
.card .row1{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:600 13px var(--mono);color:var(--muted)}
.card h3{margin:3px 0 1px;font-size:16px;line-height:1.35;word-break:keep-all}
.place{font-size:13px;color:var(--muted)}
.task{margin:8px 0 2px;padding:8px 10px;border-radius:9px;background:var(--accent-soft);font-size:14.5px;font-weight:500;white-space:pre-line;overflow-wrap:anywhere}
.task small{display:block;font:700 11px var(--body);color:var(--accent);margin-bottom:1px}
.more{all:unset;cursor:pointer;font-size:13px;color:var(--accent);margin-top:6px;display:inline-block}
.toggle{display:flex;align-items:center;gap:8px;margin:16px 0 8px;font-size:14px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}

/* 상세 창 */
dialog{border:0;border-radius:16px 16px 0 0;padding:0;width:100%;max-width:640px;max-height:85svh;margin:auto auto 0;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
@media (min-width:700px){dialog{border-radius:16px;margin:auto}}
.dl{padding:16px 18px calc(18px + env(safe-area-inset-bottom));overflow:auto;max-height:85svh}
.dl-top{display:flex;gap:8px;align-items:flex-start}
.dl-top h3{margin:2px 0 0;font-size:18px;line-height:1.35;flex:1;word-break:keep-all}
.x{border:0;background:var(--surface-2);border-radius:999px;width:34px;height:34px;font-size:18px;cursor:pointer;flex:0 0 auto}
.dl h4{font-size:12.5px;color:var(--muted);margin:14px 0 4px;font-weight:700}
.dl p{margin:0;font-size:14px;white-space:pre-line;overflow-wrap:anywhere}
.dl ul{margin:0;padding-left:18px;font-size:14px}
.memo{background:var(--warn-soft);border-radius:9px;padding:8px 10px}
.who-list{display:grid;grid-template-columns:max-content 1fr;gap:4px 10px;font-size:14px}
.who-list b{font-weight:700}
.who-list span{white-space:pre-line;overflow-wrap:anywhere}

/* 준비물 */
.sum{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.sum div{flex:1;min-width:92px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.sum b{display:block;font:600 22px var(--mono)}
.sum small{color:var(--muted);font-size:12px}
.filters{display:flex;gap:6px;margin-bottom:6px}
.sg{margin-top:16px}
.sg h3{font-size:14px;margin:0 0 6px;display:flex;gap:8px;align-items:baseline}
.sg h3 small{font:500 12px var(--mono);color:var(--muted)}
.sl{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sl li{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:start;padding:8px 12px;border-top:1px solid var(--line);font-size:14px}
.sl li:first-child{border-top:0}
.sl .ck{width:18px;height:18px;border-radius:5px;border:2px solid var(--line);margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.sl li.got .ck{background:var(--ok);border-color:var(--ok)}
.sl li.got .nm2{color:var(--muted);text-decoration:line-through}
.sl .q{font-size:12.5px;color:var(--muted);text-align:right;max-width:46vw;overflow-wrap:anywhere}
.sl .ow{display:block;font-size:12px;color:var(--muted)}

/* 지도 */
.map{position:relative;height:calc(100svh - 150px);min-height:360px;overflow:hidden;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.map.drag{cursor:grabbing}
.map img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;-webkit-user-drag:none;will-change:transform;visibility:hidden}
.map.ready img{visibility:visible}
.map-ctl{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.map-ctl button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 20px/1 var(--body);box-shadow:0 2px 6px rgba(0,0,0,.15);cursor:pointer}
.map-hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(27,27,27,.75);color:#FFFAEC;font-size:12.5px;padding:5px 11px;border-radius:999px;white-space:nowrap;pointer-events:none;transition:opacity .4s}
.map-hint.off{opacity:0}
.map-err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--muted);font-size:14px}
.map-sub{margin:10px 2px 0;font-size:13px;color:var(--muted)}
.map-sub a{color:var(--accent)}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="eyebrow"><span id="sub"></span><span class="staff-badge">운영진 전용</span></div>
    <h1 id="name">김장대첩 운영진 보드</h1>
    <ul class="facts" id="facts"></ul>
  </div>
</header>

<nav class="bar" aria-label="보기 선택">
  <div class="wrap tabs" role="tablist" id="tabs"></div>
</nav>

<main class="wrap">
  <div class="msg" id="msg" hidden></div>
  <div id="view"><div class="empty">일정을 불러오는 중입니다…</div></div>
</main>
<footer class="wrap" id="foot"></footer>

<dialog id="dlg" aria-labelledby="dlg-t"><div class="dl" id="dlg-b"></div></dialog>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
(function () {
  "use strict";

  /* 데이터 파일 이름과 지도 이미지 이름 (같은 저장소에 함께 올려 주세요) */
  var DATA_FILE = "admin_schedule.xlsx";
  var MAP_SRC = "김장대첩지도.png", MAP_ALT = "김장대첩지도.PNG";

  var $ = function (id) { return document.getElementById(id); };
  var D = { info: {}, infoOrder: [], items: [], staff: [], sups: [], notes: [] };
  var view = "notice", who = "", supFilter = "all", showOthers = false;
  var HEAD_KEYS = ["행사명", "부제", "1일차 날짜", "2일차 날짜"];
  var BASE_COLS = ["일차", "시작", "종료", "세션", "프로그램", "장소", "진행 내용", "준비물", "상태", "메모"];

  try { who = localStorage.getItem("kj-admin-who") || ""; } catch (e) {}

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function str(v) { return v == null ? "" : String(v).trim(); }
  function toTime(v) {
    if (v == null || v === "") return "";
    if (typeof v === "number") { var m = Math.round((v % 1) * 1440); return pad(Math.floor(m / 60)) + ":" + pad(m % 60); }
    var s = String(v).trim(), r = s.match(/^(\d{1,2})\s*[:시.]\s*(\d{2})?/);
    return r ? pad(+r[1]) + ":" + (r[2] || "00") : s;
  }
  function toDate(v) {
    if (v == null || v === "") return "";
    if (typeof v === "number") { var d = new Date(Math.round((v - 25569) * 864e5)); return d.getUTCFullYear() + "-" + pad(d.getUTCMonth() + 1) + "-" + pad(d.getUTCDate()); }
    var r = String(v).match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
    return r ? r[1] + "-" + pad(+r[2]) + "-" + pad(+r[3]) : "";
  }
  function mins(t) { var r = /^(\d{2}):(\d{2})$/.exec(t); return r ? +r[1] * 60 + +r[2] : null; }
  function lines(s) { return str(s).split(/\r?\n/).map(function (x) { return x.replace(/^[·•\-\s]+/, "").trim(); }).filter(Boolean); }
  function stClass(s) { return s === "확정" ? "ok" : s === "확인 필요" ? "check" : "draft"; }
  function stHtml(s) { return s ? '<span class="st ' + stClass(s) + '">' + esc(s) + "</span>" : ""; }

  /* ── 엑셀 읽기 ── */
  function fromWorkbook(wb) {
    function rows(name) { var ws = wb.Sheets[name]; return ws ? XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", raw: true }) : []; }
    var info = rows("행사정보").slice(1);
    D.info = {}; D.infoOrder = [];
    info.forEach(function (r) { var k = str(r[0]); if (!k) return; D.info[k] = r[1] == null ? "" : r[1]; D.infoOrder.push(k); });

    var sr = rows("일정"), h = (sr[0] || []).map(str);
    var ix = function (n) { return h.indexOf(n); };
    /* '메모' 다음 열부터는 모두 운영진 이름 (열을 추가하면 자동으로 늘어남) */
    var staffFrom = ix("메모") + 1;
    D.staff = staffFrom > 0 ? h.slice(staffFrom).filter(Boolean) : [];
    D.items = sr.slice(1).map(function (r, k) {
      var tasks = {};
      D.staff.forEach(function (n) { var v = str(r[h.indexOf(n)]); if (v) tasks[n] = v; });
      return { id: k, day: +r[ix("일차")] === 2 ? 2 : 1, start: toTime(r[ix("시작")]), end: toTime(r[ix("종료")]),
        session: str(r[ix("세션")]), title: str(r[ix("프로그램")]), place: str(r[ix("장소")]), desc: str(r[ix("진행 내용")]),
        sups: lines(r[ix("준비물")]), status: str(r[ix("상태")]), memo: str(r[ix("메모")]), tasks: tasks };
    }).filter(function (i) { return i.title; })
      .sort(function (a, b) { return a.day - b.day || a.start.localeCompare(b.start) || (a.end || "99").localeCompare(b.end || "99"); });

    var pr = rows("준비물"), ph = (pr[0] || []).map(str), pi = function (n) { return ph.indexOf(n); };
    D.sups = pr.slice(1).map(function (r, k) {
      return { k: k, name: str(r[pi("품목")]), qty: str(r[pi("수량")]), day: +r[pi("일차")] === 2 ? 2 : 1, time: toTime(r[pi("사용 시간")]),
        session: str(r[pi("세션")]), owner: str(r[pi("담당")]), got: /^(o|ㅇ|y|yes|v|✓|1|true|확보)$/i.test(str(r[pi("확보")])), memo: str(r[pi("메모")]) };
    }).filter(function (s) { return s.name; });

    var nr = rows("공지"), nh = (nr[0] || []).map(str), ni = function (n) { return nh.indexOf(n); };
    D.notes = nr.slice(1).map(function (r, k) {
      return { pin: /^(o|ㅇ|y|yes|중요|v|✓|1|true)$/i.test(str(r[ni("중요")])), title: str(r[ni("제목")]), body: str(r[ni("내용")]), date: toDate(r[ni("게시일")]) || str(r[ni("게시일")]), k: k };
    }).filter(function (n) { return n.title || n.body; })
      .sort(function (a, b) { return (b.pin - a.pin) || String(b.date).localeCompare(String(a.date)) || a.k - b.k; });

    if (who && D.staff.indexOf(who) < 0) who = "";
  }

  /* ── 날짜·시간 ── */
  function dayDate(d) { return toDate(D.info[d + "일차 날짜"]); }
  function today() { var n = new Date(); return n.getFullYear() + "-" + pad(n.getMonth() + 1) + "-" + pad(n.getDate()); }
  function dayLabel(d) {
    var ds = dayDate(d); if (!ds) return d + "일차";
    var p = ds.split("-"), w = "일월화수목금토"[new Date(+p[0], +p[1] - 1, +p[2]).getDay()];
    return d + "일차 · " + (+p[1]) + "/" + (+p[2]) + "(" + w + ")";
  }
  function timeTxt(i) { return i.start + (i.end ? "~" + i.end : ""); }
  /* 지금 진행 중(cur) / 지난 일정(past). 21:00~07:00처럼 자정을 넘기면 다음 날 아침까지 진행 중 */
  function state(i) {
    var ds = dayDate(i.day), td = today(); if (!ds) return "";
    var s = mins(i.start), e = mins(i.end); if (s == null) return "";
    if (e == null) e = s + 30;
    var over = e <= s;
    var n = new Date(), now = n.getHours() * 60 + n.getMinutes();
    if (ds === td) { return over ? (now >= s ? "cur" : "") : (now >= e ? "past" : now >= s ? "cur" : ""); }
    if (ds < td) {
      if (over) { var nx = new Date(ds + "T00:00:00"); nx.setDate(nx.getDate() + 1); var nd = nx.getFullYear() + "-" + pad(nx.getMonth() + 1) + "-" + pad(nx.getDate()); if (nd === td && now < e) return "cur"; }
      return "past";
    }
    return "";
  }

  /* ── 머리글·탭 ── */
  function renderHead() {
    $("name").textContent = D.info["행사명"] ? D.info["행사명"] + " 운영진 보드" : "김장대첩 운영진 보드";
    $("sub").textContent = D.info["부제"] || "";
    $("facts").innerHTML = D.infoOrder.filter(function (k) { return HEAD_KEYS.indexOf(k) < 0 && D.info[k] !== ""; })
      .map(function (k) { return "<li><b>" + esc(k) + "</b><span>" + esc(D.info[k]) + "</span></li>"; }).join("");
  }
  function renderTabs() {
    var open = D.items.filter(function (i) { return i.status && i.status !== "확정"; }).length;
    var tabs = [{ v: "notice", t: "공지", s: open ? "확인 " + open : "" }].concat([1, 2].map(function (d) {
      var ds = dayDate(d), p = ds ? ds.split("-") : null; return { v: "d" + d, t: d + "일차", s: p ? (+p[1]) + "/" + (+p[2]) : "" };
    })).concat([{ v: "sup", t: "준비물", s: D.sups.filter(function (s) { return !s.got; }).length + "남음" }, { v: "map", t: "지도", s: "행사장" }]);
    $("tabs").innerHTML = tabs.map(function (x) {
      return '<button class="tab" role="tab" type="button" data-v="' + x.v + '" aria-selected="' + (x.v === view) + '">' + esc(x.t) + "<small>" + esc(x.s || " ") + "</small></button>";
    }).join("");
  }

  /* ── 공지 ── */
  function viewNotice() {
    var h = '<h2 class="sec-h">운영 공지</h2>';
    h += D.notes.length ? '<div class="notes">' + D.notes.map(function (n) {
      return '<article class="note' + (n.pin ? " pin" : "") + '"><h3>' + (n.pin ? '<span class="tag">중요</span>' : "") + esc(n.title) +
        (n.date ? '<span class="d">' + esc(n.date) + "</span>" : "") + "</h3><p>" + esc(n.body) + "</p></article>";
    }).join("") + "</div>" : '<div class="empty">아직 공지가 없습니다.</div>';
    var open = D.items.filter(function (i) { return i.status && i.status !== "확정"; });
    h += '<h2 class="sec-h">확정 전 항목<small>' + open.length + "건 · 눌러서 자세히</small></h2>";
    h += open.length ? '<div class="todo">' + open.map(function (i) {
      return '<button type="button" data-open="' + i.id + '"><span class="tm">' + i.day + "일차 " + esc(timeTxt(i)) + "</span> " + stHtml(i.status) +
        "<b>" + esc(i.title) + "</b>" + (i.memo ? "<p>" + esc(i.memo) + "</p>" : "") + "</button>";
    }).join("") + "</div>" : '<div class="empty">모든 일정이 확정됐어요.</div>';
    return h;
  }

  /* ── 일정 ── */
  function whoBar() {
    return '<div class="who"><div class="who-l">이름을 누르면 내 할 일만 볼 수 있어요</div><div class="names" id="names">' +
      '<button type="button" class="nm all" data-who="" aria-pressed="' + (!who) + '">전체 표</button>' +
      D.staff.map(function (n) { return '<button type="button" class="nm" data-who="' + esc(n) + '" aria-pressed="' + (who === n) + '">' + esc(n) + "</button>"; }).join("") +
      "</div></div>";
  }
  function gridHtml(list) {
    var h = '<p class="grid-hint">← 옆으로 밀면 운영진 ' + D.staff.length + "명의 할 일이 보여요 · 프로그램을 누르면 상세 내용</p>";
    h += '<div class="gwrap"><table class="g"><thead><tr><th class="c0">시간 · 프로그램</th>' +
      D.staff.map(function (n) { return "<th>" + esc(n) + "</th>"; }).join("") + "</tr></thead><tbody>";
    h += list.map(function (i) {
      return '<tr class="' + state(i) + '"><td class="c0"><button type="button" data-open="' + i.id + '"><span class="tm">' + esc(timeTxt(i)) + "</span><b>" + esc(i.title) + "</b>" + stHtml(i.status) + "</button></td>" +
        D.staff.map(function (n) { var t = i.tasks[n]; return t ? '<td class="p has">' + esc(t) + "</td>" : '<td class="p none">·</td>'; }).join("") + "</tr>";
    }).join("");
    return h + "</tbody></table></div>";
  }
  function cardHtml(i, mine) {
    var st = state(i);
    return '<article class="card ' + st + (mine ? "" : " other") + '"><div class="row1">' + esc(timeTxt(i)) + (i.session ? ' <span class="chip">' + esc(i.session) + "</span>" : "") + " " + stHtml(i.status) + "</div>" +
      "<h3>" + esc(i.title) + "</h3>" + (i.place ? '<div class="place">📍 ' + esc(i.place) + "</div>" : "") +
      (mine ? '<div class="task"><small>내 할 일</small>' + esc(i.tasks[who]) + "</div>" : "") +
      '<button type="button" class="more" data-open="' + i.id + '">진행 내용 · 준비물 · 메모 보기 ›</button></article>';
  }
  function viewDay(d) {
    var list = D.items.filter(function (i) { return i.day === d; });
    var h = whoBar();
    if (!list.length) return h + '<div class="empty">' + d + "일차 일정이 없습니다.</div>";
    if (!who) return h + gridHtml(list);
    var mine = list.filter(function (i) { return i.tasks[who]; }), rest = list.filter(function (i) { return !i.tasks[who]; });
    h += '<div class="mine-h"><h2>' + esc(who) + "님의 " + esc(dayLabel(d)) + "</h2><small>할 일 " + mine.length + "개</small></div>";
    if (!mine.length) {
      h += '<div class="empty">아직 배정된 일이 없어요.<br>엑셀 일정 시트의 \'' + esc(who) + "' 열에 적으면 여기에 나타나요.</div>";
      h += '<h2 class="sec-h">' + esc(dayLabel(d)) + " 전체 일정</h2>";
      return h + '<div class="cards">' + list.map(function (i) { return cardHtml(i, false); }).join("") + "</div>";
    }
    h += '<div class="cards">' + mine.map(function (i) { return cardHtml(i, true); }).join("") + "</div>";
    h += '<label class="toggle"><input type="checkbox" id="others"' + (showOthers ? " checked" : "") + "> 내 일이 아닌 일정도 보기 (" + rest.length + ")</label>";
    if (showOthers) h += '<div class="cards">' + rest.map(function (i) { return cardHtml(i, false); }).join("") + "</div>";
    return h;
  }

  /* ── 상세 창 ── */
  function openDetail(id) {
    var i = D.items.filter(function (x) { return x.id === +id; })[0]; if (!i) return;
    var names = D.staff.filter(function (n) { return i.tasks[n]; });
    var h = '<div class="dl-top"><div style="flex:1"><div class="row1" style="font:600 13px var(--mono);color:var(--muted)">' + i.day + "일차 · " + esc(timeTxt(i)) + " " + stHtml(i.status) + "</div>" +
      '<h3 id="dlg-t">' + esc(i.title) + '</h3></div><button type="button" class="x" data-close aria-label="닫기">×</button></div>';
    if (i.session || i.place) h += '<p class="place" style="margin-top:4px">' + (i.session ? esc(i.session) : "") + (i.session && i.place ? " · " : "") + (i.place ? "📍 " + esc(i.place) : "") + "</p>";
    if (i.desc) h += "<h4>진행 내용</h4><p>" + esc(i.desc) + "</p>";
    h += "<h4>담당 · 할 일</h4>" + (names.length ? '<div class="who-list">' + names.map(function (n) { return "<b>" + esc(n) + "</b><span>" + esc(i.tasks[n]) + "</span>"; }).join("") + "</div>" : '<p style="color:var(--muted)">미배정</p>');
    if (i.sups.length) h += "<h4>준비물</h4><ul>" + i.sups.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ul>";
    if (i.memo) h += '<h4>메모 · 확인할 것</h4><p class="memo">' + esc(i.memo) + "</p>";
    $("dlg-b").innerHTML = h;
    var d = $("dlg"); if (d.showModal) d.showModal(); else d.setAttribute("open", "");
  }
  $("dlg").addEventListener("click", function (e) {
    if (e.target === this || e.target.closest("[data-close]")) { if (this.close) this.close(); else this.removeAttribute("open"); }
  });

  /* ── 준비물 ── */
  function viewSup() {
    var all = D.sups, got = all.filter(function (s) { return s.got; }).length;
    var h = '<div class="sum"><div><b>' + all.length + "</b><small>전체 품목</small></div><div><b style=\"color:var(--ok)\">" + got + "</b><small>확보</small></div><div><b style=\"color:var(--accent)\">" + (all.length - got) + "</b><small>미확보</small></div></div>";
    h += '<div class="filters">' + [["all", "전체"], ["need", "미확보만"], ["got", "확보만"]].map(function (f) {
      return '<button type="button" class="nm' + (f[0] === "all" ? " all" : "") + '" data-sf="' + f[0] + '" aria-pressed="' + (supFilter === f[0]) + '">' + f[1] + "</button>";
    }).join("") + "</div>";
    var list = all.filter(function (s) { return supFilter === "all" || (supFilter === "got" ? s.got : !s.got); });
    if (!list.length) return h + '<div class="empty" style="margin-top:12px">해당하는 품목이 없어요.</div>';
    var groups = [], key = {};
    list.slice().sort(function (a, b) { return a.day - b.day || a.time.localeCompare(b.time) || a.k - b.k; }).forEach(function (s) {
      var g = s.day + "|" + s.session;
      if (!key[g]) { key[g] = { day: s.day, time: s.time, session: s.session || "기타", list: [] }; groups.push(key[g]); }
      key[g].list.push(s);
    });
    h += groups.map(function (g) {
      return '<section class="sg"><h3>' + esc(g.session) + "<small>" + g.day + "일차 " + esc(g.time) + "</small></h3><ul class=\"sl\">" + g.list.map(function (s) {
        return '<li class="' + (s.got ? "got" : "") + '"><span class="ck">' + (s.got ? "✓" : "") + '</span><span><span class="nm2">' + esc(s.name) + "</span>" +
          (s.owner || s.memo ? '<span class="ow">' + esc([s.owner && "담당 " + s.owner, s.memo].filter(Boolean).join(" · ")) + "</span>" : "") + '</span><span class="q">' + esc(s.qty) + "</span></li>";
      }).join("") + "</ul></section>";
    }).join("");
    return h + '<p class="msg">확보 표시는 엑셀 \'준비물\' 시트의 \'확보\' 칸에 O를 적고 다시 올리면 바뀌어요.</p>';
  }

  /* ── 지도 (두 손가락 확대 · 끌어서 이동 · 두 번 탭) ── */
  function mapHtml() {
    var src = encodeURI(MAP_SRC);
    return '<div class="map" id="map"><img id="mapimg" src="' + src + '?v=1" alt="김장대첩 행사장 지도" draggable="false">' +
      '<div class="map-hint" id="maphint">두 손가락으로 확대 · 끌어서 이동</div>' +
      '<div class="map-ctl"><button type="button" data-z="in" aria-label="확대">+</button><button type="button" data-z="out" aria-label="축소">−</button><button type="button" data-z="fit" aria-label="전체 보기">⤢</button></div></div>' +
      '<p class="map-sub">잘 안 보이면 <a href="' + src + '" target="_blank" rel="noopener">지도 원본 이미지 열기</a></p>';
  }
  function setupMap() {
    var box = $("map"), img = $("mapimg"), hint = $("maphint");
    var W = 0, H = 0, iw = 0, ih = 0, minS = 1, maxS = 4, s = 1, x = 0, y = 0, pts = {}, last = null, lastTap = 0, triedAlt = false;
    function clamp() { s = Math.min(maxS, Math.max(minS, s)); var w = iw * s, h = ih * s;
      x = w <= W ? (W - w) / 2 : Math.min(0, Math.max(W - w, x)); y = h <= H ? (H - h) / 2 : Math.min(0, Math.max(H - h, y)); }
    function draw(a) { clamp(); img.style.transition = a ? "transform .25s ease" : "none"; img.style.transform = "translate(" + x + "px," + y + "px) scale(" + s + ")"; }
    function zoomAt(ns, cx, cy, a) { ns = Math.min(maxS, Math.max(minS, ns)); x = cx - (cx - x) * ns / s; y = cy - (cy - y) * ns / s; s = ns; draw(a); }
    function start() { W = box.clientWidth; H = box.clientHeight; iw = img.naturalWidth; ih = img.naturalHeight;
      minS = Math.min(W / iw, H / ih); var cover = Math.max(W / iw, H / ih); maxS = Math.max(cover * 4, 2);
      s = cover; x = (W - iw * s) / 2; y = (H - ih * s) / 2; draw(false); box.classList.add("ready"); }
    if (img.complete && img.naturalWidth) start(); else img.addEventListener("load", start);
    img.addEventListener("error", function () {
      if (!triedAlt && MAP_ALT) { triedAlt = true; img.src = encodeURI(MAP_ALT) + "?v=1"; return; }
      box.innerHTML = '<div class="map-err">지도 이미지(' + esc(MAP_SRC) + ")를 찾을 수 없습니다.<br>저장소에 같은 이름으로 올라가 있는지 확인해 주세요.</div>";
    });
    setTimeout(function () { hint && hint.classList.add("off"); }, 3500);
    function rel(e) { var r = box.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
    function pair() { var k = Object.keys(pts); if (k.length < 2) return null; var a = pts[k[0]], b = pts[k[1]]; return { cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2, d: Math.hypot(a.x - b.x, a.y - b.y) }; }
    box.addEventListener("pointerdown", function (e) {
      if (e.target.closest(".map-ctl") || !iw) return;
      box.setPointerCapture(e.pointerId); pts[e.pointerId] = rel(e); last = pair() || pts[e.pointerId];
      box.classList.add("drag"); hint && hint.classList.add("off");
      if (Object.keys(pts).length === 1) { var now = Date.now(), p = pts[e.pointerId];
        if (now - lastTap < 300) { zoomAt(s < minS * 2.2 ? s * 2.2 : minS, p.x, p.y, true); lastTap = 0; } else lastTap = now; }
    });
    box.addEventListener("pointermove", function (e) {
      if (!pts[e.pointerId]) return; pts[e.pointerId] = rel(e); var p = pair();
      if (p && last && last.d) { var ns = Math.min(maxS, Math.max(minS, s * p.d / last.d)); x = p.cx - (last.cx - x) * ns / s; y = p.cy - (last.cy - y) * ns / s; s = ns; draw(false); last = p; }
      else if (!p && last) { var c = pts[e.pointerId]; x += c.x - last.x; y += c.y - last.y; draw(false); last = c; }
    });
    function up(e) { delete pts[e.pointerId]; var k = Object.keys(pts); last = k.length ? pts[k[0]] : null; if (!k.length) box.classList.remove("drag"); }
    box.addEventListener("pointerup", up); box.addEventListener("pointercancel", up);
    box.addEventListener("wheel", function (e) { if (!iw) return; e.preventDefault(); var p = rel(e); zoomAt(s * (e.deltaY < 0 ? 1.15 : 1 / 1.15), p.x, p.y, false); }, { passive: false });
    box.querySelector(".map-ctl").addEventListener("click", function (e) {
      var b = e.target.closest("button"); if (!b || !iw) return; var z = b.dataset.z;
      if (z === "in") zoomAt(s * 1.6, W / 2, H / 2, true); else if (z === "out") zoomAt(s / 1.6, W / 2, H / 2, true);
      else zoomAt(s > minS * 1.01 ? minS : Math.max(W / iw, H / ih), W / 2, H / 2, true);
    });
    function onResize() { if (!document.body.contains(box)) { removeEventListener("resize", onResize); return; } if (iw) start(); }
    addEventListener("resize", onResize);
  }

  /* ── 그리기 ── */
  function render() {
    renderHead(); renderTabs();
    var v = $("view");
    if (view === "map") { v.innerHTML = mapHtml(); setupMap(); return; }
    var sx = 0, g = v.querySelector(".gwrap"); if (g) sx = g.scrollLeft;
    v.innerHTML = view === "notice" ? viewNotice() : view === "sup" ? viewSup() : viewDay(+view.slice(1));
    g = v.querySelector(".gwrap"); if (g && sx) g.scrollLeft = sx;
    var me = v.querySelector(".nm[aria-pressed=true]:not(.all)"); if (me) me.scrollIntoView({ block: "nearest", inline: "center" });
  }

  $("tabs").addEventListener("click", function (e) {
    var b = e.target.closest(".tab"); if (!b) return;
    view = b.dataset.v; try { history.replaceState(null, "", "#" + view); } catch (x) {}
    render(); window.scrollTo({ top: document.querySelector(".bar").offsetTop, behavior: "smooth" });
  });
  $("view").addEventListener("click", function (e) {
    var o = e.target.closest("[data-open]"); if (o) { openDetail(o.dataset.open); return; }
    var n = e.target.closest("[data-who]");
    if (n) { who = n.dataset.who; try { localStorage.setItem("kj-admin-who", who); } catch (x) {} render(); return; }
    var f = e.target.closest("[data-sf]"); if (f) { supFilter = f.dataset.sf; render(); }
  });
  $("view").addEventListener("change", function (e) { if (e.target.id === "others") { showOthers = e.target.checked; render(); } });

  function startView() {
    var h = location.hash.slice(1);
    if (/^(notice|d1|d2|sup|map)$/.test(h)) return h;
    var td = today(); if (dayDate(1) === td) return "d1"; if (dayDate(2) === td) return "d2";
    return "notice";
  }
  function showMsg(t) { $("msg").textContent = t; $("msg").hidden = !t; }
  function boot() {
    if (!window.XLSX || location.protocol === "file:") return Promise.reject(new Error("local"));
    return fetch(DATA_FILE + "?v=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.arrayBuffer(); })
      .then(function (buf) { fromWorkbook(XLSX.read(buf, { type: "array" })); });
  }
  boot().then(function () { showMsg(""); }, function (err) {
    showMsg(err && err.message === "local"
      ? "PC에서 파일을 직접 열면 엑셀을 읽지 못합니다. GitHub 페이지 주소로 열어 주세요."
      : "데이터 파일(" + DATA_FILE + ")을 불러오지 못했습니다. 같은 저장소에 올라가 있는지 확인하고 새로고침해 주세요.");
  }).then(function () {
    view = startView();
    $("foot").textContent = "운영진 전용 페이지 · 내용은 " + DATA_FILE + "을 고쳐 올리면 바뀝니다.";
    render();
    setInterval(function () { if (view !== "map" && !($("dlg").open)) render(); }, 60000);
  });
})();
</script>
</body>
</html>
